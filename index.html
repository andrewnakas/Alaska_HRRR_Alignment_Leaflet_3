<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alaska HRRR Alignment Leaflet Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="header">
        <h1>Alaska HRRR Alignment Leaflet Map</h1>
        <div id="controls">
            <button id="loadDataBtn" class="btn">Load HRRR 0-Hour Imagery</button>
            <button id="clearDataBtn" class="btn">Clear Data</button>
            <select id="plotTypeSelect" class="select-control">
                <option value="cref_full_sfc">Composite Reflectivity</option>
                <option value="1ref_full_1000m">1 km AGL Reflectivity</option>
                <option value="mref_full_sfc">Max 1km Reflectivity</option>
                <option value="allfields">All Fields</option>
            </select>
            <span id="status"></span>
        </div>
    </div>

    <div id="map"></div>

    <div id="info-panel">
        <h3>About</h3>
        <p>This map displays High-Resolution Rapid Refresh (HRRR) model reference points for Alaska.</p>
        <p><strong>HRRR-Alaska Specifications:</strong></p>
        <ul>
            <li>Resolution: 3 km</li>
            <li>Coverage: Alaska region</li>
            <li>Update Frequency: Hourly</li>
        </ul>
        <div id="point-info"></div>
    </div>

    <!-- Proj4 JS for coordinate projection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

    <!-- Leaflet JS (must load before Proj4Leaflet) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- Proj4Leaflet for projection support in Leaflet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4leaflet/1.0.2/proj4leaflet.min.js"></script>

    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
